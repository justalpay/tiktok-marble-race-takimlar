<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="donutDough" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="60%" stop-color="#DE9B52"/>
      <stop offset="100%" stop-color="#9C5B23"/>
    </radialGradient>
    <linearGradient id="glazeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#C71585"/>
    </linearGradient>
    <radialGradient id="glazeHighlight" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="donutShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Arka gölge -->
  <g filter="url(#donutShadow)">
    <!-- Hamur -->
    <path fill="url(#donutDough)" fill-rule="evenodd" d="M 50 10 A 40 40 0 1 0 50 90 A 40 40 0 1 0 50 10 Z M 50 35 A 15 15 0 1 1 50 65 A 15 15 0 1 1 50 35 Z"/>
    
    <!-- Çilekli Krema / Glaze -->
    <path fill="url(#glazeGrad)" fill-rule="evenodd" d="M 50 12 C 60 12, 70 14, 78 22 C 86 30, 89 42, 87 52 C 85 62, 78 72, 72 79 C 64 87, 52 88, 44 87 C 36 86, 28 84, 21 77 C 14 70, 11 58, 13 48 C 15 36, 24 24, 34 17 C 40 13, 45 12, 50 12 Z M 50 36 C 45 36, 40 39, 38 43 C 36 48, 38 54, 41 58 C 45 63, 52 64, 57 63 C 62 61, 64 55, 63 50 C 62 44, 57 36, 50 36 Z"/>
    
    <!-- Parlama efekti -->
    <path fill="url(#glazeHighlight)" d="M 30 20 C 40 14, 60 14, 70 20 C 65 24, 45 24, 30 20 Z"/>
    
    <!-- Renkli Şekerlemeler (Sprinkles) -->
    <!-- Mavi -->
    <rect x="32" y="24" width="7" height="3" rx="1.5" fill="#00E5FF" transform="rotate(25 35 25)"/>
    <rect x="68" y="32" width="7" height="3" rx="1.5" fill="#00E5FF" transform="rotate(-40 71 33)"/>
    <rect x="42" y="76" width="7" height="3" rx="1.5" fill="#00E5FF" transform="rotate(15 45 77)"/>
    
    <!-- Sarı -->
    <rect x="48" y="20" width="7" height="3" rx="1.5" fill="#FFE600" transform="rotate(-15 51 21)"/>
    <rect x="74" y="48" width="7" height="3" rx="1.5" fill="#FFE600" transform="rotate(60 77 49)"/>
    <rect x="24" y="60" width="7" height="3" rx="1.5" fill="#FFE600" transform="rotate(45 27 61)"/>
    
    <!-- Beyaz -->
    <rect x="62" y="22" width="7" height="3" rx="1.5" fill="#FFFFFF" transform="rotate(40 65 23)"/>
    <rect x="22" y="42" width="7" height="3" rx="1.5" fill="#FFFFFF" transform="rotate(-20 25 43)"/>
    <rect x="60" y="74" width="7" height="3" rx="1.5" fill="#FFFFFF" transform="rotate(-30 63 75)"/>
    
    <!-- Yeşil -->
    <rect x="75" y="62" width="7" height="3" rx="1.5" fill="#00FF88" transform="rotate(10 78 63)"/>
    <rect x="32" y="72" width="7" height="3" rx="1.5" fill="#00FF88" transform="rotate(-50 35 73)"/>
  </g>
</svg>