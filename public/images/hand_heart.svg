<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#FF0055"/>
      <stop offset="100%" stop-color="#990033"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD1B3"/>
      <stop offset="60%" stop-color="#E89F71"/>
      <stop offset="100%" stop-color="#BD7447"/>
    </linearGradient>
    <radialGradient id="iceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0088FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Mavi Buz / Dondurucu Işıma -->
  <circle cx="50" cy="50" r="44" fill="url(#iceGlow)"/>

  <!-- Kalp / Parmaklar -->
  <g filter="url(#handShadow)">
    <!-- Arka Kalp Şekli -->
    <path d="M 50 35 C 50 25, 38 18, 28 24 C 18 30, 18 45, 28 56 L 50 78 L 72 56 C 82 45, 82 30, 72 24 C 62 18, 50 25, 50 35 Z" fill="url(#heartGrad)"/>
    
    <!-- Kalp Parlaması -->
    <path d="M 30 26 C 25 30, 24 38, 28 46 C 30 42, 33 30, 42 27 C 36 24, 32 25, 30 26 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- İki Elin Kalp Oluşturan Parmakları (Stylized TikTok Hand Heart) -->
    <!-- Sol Başparmak & İşaret Parmakları -->
    <path d="M 22 75 C 20 60, 24 45, 36 38 C 42 34, 46 38, 43 45 C 40 52, 33 58, 35 68 C 36 74, 30 80, 24 82 Z" fill="url(#handGrad)" stroke="#A05A32" stroke-width="1.5"/>
    <path d="M 38 42 C 45 42, 48 48, 44 54 C 40 59, 36 66, 42 74" fill="none" stroke="#D28153" stroke-width="2" stroke-linecap="round"/>

    <!-- Sağ Başparmak & İşaret Parmakları -->
    <path d="M 78 75 C 80 60, 76 45, 64 38 C 58 34, 54 38, 57 45 C 60 52, 67 58, 65 68 C 64 74, 70 80, 76 82 Z" fill="url(#handGrad)" stroke="#A05A32" stroke-width="1.5"/>
    <path d="M 62 42 C 55 42, 52 48, 56 54 C 60 59, 64 66, 58 74" fill="none" stroke="#D28153" stroke-width="2" stroke-linecap="round"/>

    <!-- Kar Tanesi / Buz Kristali Simgesi (Dondurma Gücü Vurgusu) -->
    <g transform="translate(70, 18) scale(0.6)">
      <circle cx="20" cy="20" r="16" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M 20 8 L 20 32 M 8 20 L 32 20 M 11 11 L 29 29 M 11 29 L 29 11" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>