<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="likeGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="60%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </radialGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0"/>
    </radialGradient>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D50000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#heartShadow)">
    <!-- 3D TikTok Kalp -->
    <path d="M 50 82 C 48 80, 16 54, 16 32 C 16 19, 27 12, 38 12 C 44 12, 48 15, 50 19 C 52 15, 56 12, 62 12 C 73 12, 84 19, 84 32 C 84 54, 52 80, 50 82 Z" fill="url(#likeGlow)"/>
    
    <!-- Üst parlak kavis -->
    <path d="M 23 30 C 23 22, 30 16, 38 16 C 42 16, 46 18, 48 22 C 45 19, 39 19, 34 22 C 28 25, 25 32, 23 30 Z" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="32" cy="26" rx="8" ry="4" transform="rotate(-30 32 26)" fill="#FFFFFF" opacity="0.6"/>

    <!-- Kanat / Hız Çizgileri (Boost simgesi) -->
    <path d="M 12 38 L 4 42 M 10 48 L 2 54 M 14 58 L 6 64" stroke="#FFE600" stroke-width="3" stroke-linecap="round"/>
    <path d="M 88 38 L 96 42 M 90 48 L 98 54 M 86 58 L 94 64" stroke="#FFE600" stroke-width="3" stroke-linecap="round"/>

    <!-- Küçük 1K Yıldız Rozeti -->
    <circle cx="50" cy="46" r="14" fill="#FFE600" stroke="#FFFFFF" stroke-width="2"/>
    <text x="50" y="51" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#D50000" text-anchor="middle">1K</text>
  </g>
</svg>